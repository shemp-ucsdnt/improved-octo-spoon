[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jot"
version = "0.1.0"
description = "A tiny local-first command-line task manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jot = "jot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jot"]

[project.optional-dependencies]
dev = ["pytest"]
